name: Terraform module checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        module:
          - certificate
          - bastion
          - container-registry
          - dns-record
          - dns-zone
          - droplet
          - firewall
          - kubernetes
          - load-balancer
          - managed-database
          - managed-mysql
          - managed-postgres
          - managed-valkey
          - project
          - project-resources
          - reserved-ip
          - spaces
          - spaces-with-cdn
          - vpc
    uses: opsd-io/public-workflows/.github/workflows/terraform-module.yml@main
    with:
      working-directory: modules/${{ matrix.module }}
