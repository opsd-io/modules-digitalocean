name: Release integration qualification

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  release-integration:
    uses: opsd-io/private-workflows/.github/workflows/opsd-private-integration.yml@main
    with:
      cli-ref: main
      modules-ref: ${{ github.event.pull_request.head.sha }}
      integration-tests-repository: opsd-io/integration-tests
      integration-tests-ref: main
      release-integration: true
      release-component: modules
