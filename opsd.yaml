renderer:
  repo: https://github.com/opsd-io/opsd-cli.git
  ref: main

profiles:
  compute:
    droplet:
      - s-1vcpu-1gb
      - s-1vcpu-2gb
      - s-2vcpu-4gb
    kubernetes:
      - s-2vcpu-4gb
  databases:
    postgres:
      - db-s-1vcpu-1gb
      - db-s-2vcpu-4gb
    mysql:
      - db-s-1vcpu-1gb
      - db-s-2vcpu-4gb
  caches:
    valkey:
      - db-s-1vcpu-1gb
      - db-s-2vcpu-4gb
  object_storage:
    spaces:
      - standard

addons:
  databases:
    - postgres
    - mysql
  caches:
    - valkey
  object_storage:
    - spaces
  cdn_endpoints:
    - cdn
  load_balancers:
    - public
    - private
  nodes:
    - vm
